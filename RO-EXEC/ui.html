<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loader — RO-EXEC</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0c0f;
    --surface:   #111318;
    --sidebar:   #0e0f13;
    --border:    #1e2028;
    --border2:   #252830;
    --text:      #d4d6e0;
    --text-dim:  #5a5e6e;
    --text-mute: #3a3d4a;
    --accent:    #4f8ef7;
    --green:     #3ecf6e;
    --red:       #f74f4f;
    --yellow:    #f7c94f;
    --editor-bg: #0d0e12;
    --editor-ln: #1a1c23;
    --scrollbar: #1e2028;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; user-select: none; }

  /* ── Layout ── */
  .app { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    width: 52px; background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center; padding: 12px 0; gap: 4px;
    flex-shrink: 0; z-index: 10;
  }
  .sidebar-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--border2); display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px; cursor: default;
    border: 1px solid var(--border2);
  }
  .sidebar-logo svg { opacity: .7; }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 9px; border: none;
    background: transparent; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background .15s, color .15s; color: var(--text-dim);
    position: relative;
  }
  .nav-btn:hover { background: var(--border2); color: var(--text); }
  .nav-btn.active { background: var(--border2); color: var(--accent); }
  .nav-btn.active::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .sidebar-spacer { flex: 1; }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  /* ── Topbar ── */
  .topbar {
    height: 42px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 14px; gap: 8px;
    flex-shrink: 0;
  }
  .topbar-title { font-size: 12px; color: var(--text-dim); font-family: 'JetBrains Mono'; flex: 1; }
  .topbar-btn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border2);
    background: var(--editor-ln); cursor: pointer; display: flex; align-items: center;
    justify-content: center; color: var(--text-dim); transition: all .15s;
  }
  .topbar-btn:hover { color: var(--text); background: var(--border2); }
  .instance-badge {
    display: flex; align-items: center; gap: 6px; background: var(--editor-ln);
    border: 1px solid var(--border2); border-radius: 7px; padding: 0 10px; height: 28px;
    font-size: 13px; font-weight: 600; color: var(--text-dim); font-family: 'JetBrains Mono';
  }
  .instance-count { color: var(--text); min-width: 16px; text-align: center; }
  .avatar-btn {
    width: 28px; height: 28px; border-radius: 50%; background: var(--border2);
    border: 1px solid var(--border2); cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all .15s; overflow: hidden;
  }
  .avatar-btn:hover { border-color: var(--accent); }

  /* ── Pages ── */
  .page { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
  .page.active { display: flex; }

  /* ── Editor Page ── */
  .content { flex: 1; display: flex; flex-direction: column; padding: 28px 32px 20px; overflow: hidden; }
  .hero-title { font-size: 42px; font-weight: 700; letter-spacing: -0.5px; color: #fff; line-height: 1; margin-bottom: 6px; }
  .hero-sub { font-size: 14px; color: var(--text-dim); font-weight: 500; margin-bottom: 20px; }
  .editor-panel {
    flex: 1; display: flex; flex-direction: column;
    background: var(--editor-bg); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; min-height: 0;
  }
  .statusbar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px; height: 36px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; transition: background 0.4s ease; }
  .status-dot.disconnected { background: var(--red); animation: pulse-red 1.5s infinite; }
  .status-dot.connected { animation: pulse-green 2s infinite; }
  @keyframes pulse-green {
    0%,100% { box-shadow: 0 0 0 0 rgba(62,207,110,.4); }
    50%      { box-shadow: 0 0 0 4px rgba(62,207,110,0); }
  }
  @keyframes pulse-red {
    0%,100% { box-shadow: 0 0 0 0 rgba(247,79,79,.4); }
    50%      { box-shadow: 0 0 0 4px rgba(247,79,79,0); }
  }
  .status-text { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
  .status-text span { color: var(--text-dim); font-weight: 500; font-size: 12px; margin-left: 6px; }
  .status-btn {
    padding: 0 12px; height: 24px; border-radius: 5px; border: none;
    font-family: 'Rajdhani'; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; letter-spacing: .3px;
  }
  .btn-clear { background: transparent; color: var(--text-dim); }
  .btn-clear:hover { color: var(--text); background: var(--border2); }
  .btn-execute { background: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(79,142,247,.25); }
  .btn-execute:hover { background: #6aa0f9; box-shadow: 0 0 18px rgba(79,142,247,.4); }
  .btn-execute:active { transform: scale(.97); }
  .btn-execute.loading { opacity: .6; pointer-events: none; }
  .editor-wrap { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .line-numbers {
    width: 42px; padding: 12px 0; background: var(--editor-ln);
    border-right: 1px solid var(--border); overflow: hidden;
    display: flex; flex-direction: column; flex-shrink: 0;
    font-family: 'JetBrains Mono'; font-size: 12.5px; color: var(--text-mute);
    line-height: 20px; text-align: right; padding-right: 10px;
  }
  textarea#editor {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: #c9cfe0; font-family: 'JetBrains Mono'; font-size: 12.5px;
    line-height: 20px; padding: 12px 16px; tab-size: 4;
    caret-color: var(--accent); user-select: text;
  }
  textarea#editor::selection { background: rgba(79,142,247,.25); }
  textarea#editor::placeholder { color: var(--text-mute); }
  textarea#editor::-webkit-scrollbar { width: 6px; height: 6px; }
  textarea#editor::-webkit-scrollbar-track { background: transparent; }
  textarea#editor::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .console-panel {
    height: 0; transition: height .2s ease; overflow: hidden;
    border-top: 1px solid transparent; flex-shrink: 0;
  }
  .console-panel.open { height: 140px; border-color: var(--border); }
  .console-header {
    display: flex; align-items: center; padding: 0 14px; height: 30px;
    background: var(--editor-ln); border-bottom: 1px solid var(--border);
  }
  .console-header span { font-size: 11px; font-weight: 600; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; flex: 1; }
  .console-close { background: none; border: none; color: var(--text-mute); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; }
  .console-close:hover { color: var(--text); }
  .console-output {
    height: calc(100% - 30px); overflow-y: auto; padding: 8px 14px;
    font-family: 'JetBrains Mono'; font-size: 11.5px; line-height: 18px;
  }
  .console-output::-webkit-scrollbar { width: 5px; }
  .console-output::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .log-line { display: flex; gap: 10px; }
  .log-time { color: var(--text-mute); flex-shrink: 0; }
  .log-line.print .log-msg { color: #c9cfe0; }
  .log-line.warn  .log-msg { color: var(--yellow); }
  .log-line.error .log-msg { color: var(--red); }
  .log-line.system .log-msg { color: var(--accent); }
  .bottom-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 0 0; flex-shrink: 0;
  }
  .tool-btn {
    padding: 0 12px; height: 28px; border-radius: 6px;
    border: 1px solid var(--border2); background: var(--editor-ln);
    color: var(--text-dim); font-family: 'Rajdhani'; font-size: 12px;
    font-weight: 600; cursor: pointer; transition: all .15s; letter-spacing: .3px;
    display: flex; align-items: center; gap: 5px;
  }
  .tool-btn:hover { color: var(--text); background: var(--border2); }
  .tool-btn svg { opacity: .7; }
  .tool-btn-spacer { flex: 1; }
  .pid-select {
    height: 28px; border-radius: 6px; border: 1px solid var(--border2);
    background: var(--editor-ln); color: var(--text-dim);
    font-family: 'Rajdhani'; font-size: 12px; font-weight: 600;
    padding: 0 8px; cursor: pointer; outline: none;
  }
  .pid-select:focus { border-color: var(--accent); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 14px; padding: 24px; width: 340px; font-family: 'Rajdhani';
  }
  .modal-icon {
    width: 42px; height: 42px; border-radius: 11px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-icon.warn { background: rgba(247,201,79,.1); border: 1px solid rgba(247,201,79,.2); }
  .modal-icon.warn svg { color: var(--yellow); }
  .modal-icon.danger { background: rgba(247,79,79,.1); border: 1px solid rgba(247,79,79,.2); }
  .modal-icon.danger svg { color: var(--red); }
  .modal h3 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .modal p  { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.5; }
  .modal-input {
    width: 100%; background: var(--editor-bg); border: 1px solid var(--border2);
    border-radius: 7px; padding: 8px 12px; color: var(--text); font-family: 'JetBrains Mono';
    font-size: 12px; outline: none; margin-bottom: 14px;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-cancel  { background: var(--editor-ln); border: 1px solid var(--border2); color: var(--text-dim); border-radius: 6px; padding: 7px 16px; font-family: 'Rajdhani'; font-size: 13px; font-weight: 600; cursor: pointer; }
  .modal-cancel:hover { color: var(--text); }
  .modal-confirm { border: none; color: #fff; border-radius: 6px; padding: 7px 16px; font-family: 'Rajdhani'; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--accent); }
  .modal-confirm:hover { opacity: .85; }
  .modal-confirm.red { background: var(--red); }
  .modal-msg { font-size: 13px; min-height: 16px; margin-top: -8px; margin-bottom: 10px; }
  .modal-msg.ok  { color: var(--green); }
  .modal-msg.err { color: var(--red); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 999;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600;
    display: none; gap: 8px; align-items: center; min-width: 200px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); transform: translateY(10px);
    transition: transform .2s, opacity .2s; opacity: 0;
  }
  .toast.show { display: flex; transform: translateY(0); opacity: 1; }
  .toast.ok  { border-color: rgba(62,207,110,.3); }
  .toast.err { border-color: rgba(247,79,79,.3); }
  .toast-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .toast.ok  .toast-dot { background: var(--green); }
  .toast.err .toast-dot { background: var(--red); }
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="#aaa" stroke-width="1.8"/>
        <path d="M9 12l2 2 4-4" stroke="#aaa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Editor -->
    <button class="nav-btn active" id="navEditor" title="Editor" onclick="showPage('editor')">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14L21 3M21 13v7a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <!-- License (redeem) -->
    <button class="nav-btn" title="Redeem License" onclick="openRedeemModal()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <!-- HWID Reset -->
    <button class="nav-btn" title="Reset HWID" onclick="openHwidModal()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114.93-4M20 12a8 8 0 01-14.93 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 7.5V4M19 7.5H15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="sidebar-spacer"></div>
  </nav>

  <!-- Main -->
  <div class="main">

    <!-- Topbar (shared) -->
    <div class="topbar">
      <span class="topbar-title" id="topbarTitle">loader — RO-EXEC</span>
      <div class="instance-badge">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>
        <span class="instance-count" id="instanceCount">0</span>
        <button class="topbar-btn" style="width:20px;height:20px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;padding:0;" onclick="refreshStatus()" title="Refresh">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114.93-4M20 12a8 8 0 01-14.93 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="topbar-btn" title="Toggle console" onclick="toggleConsole()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="19" x2="20" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

    </div>

    <!-- ══ PAGE: Editor ══ -->
    <div class="page active" id="pageEditor">
      <div class="content">
        <div class="hero-title">RO-EXEC</div>
        <div class="hero-sub">User Interface for RO-EXEC, provided by loader.live.</div>

        <div class="editor-panel">
          <!-- Statusbar -->
          <div class="statusbar">
            <div class="status-dot disconnected" id="statusDot"></div>
            <div class="status-text" id="statusText">
              Disconnected
              <span id="statusSub"></span>
            </div>
            <button class="status-btn btn-clear" onclick="clearEditor()">Clear</button>
            <button class="status-btn btn-execute" id="execBtn" onclick="executeScript()">Execute</button>
          </div>

          <!-- Editor -->
          <div class="editor-wrap">
            <div class="line-numbers" id="lineNums"><span>1</span></div>
            <textarea id="editor" spellcheck="false" placeholder="-- Write your Lua script here...">-- RO-EXEC</textarea>
          </div>

          <!-- Console -->
          <div class="console-panel" id="consolePanel">
            <div class="console-header">
              <span>Output</span>
              <button class="console-close" onclick="toggleConsole()">×</button>
            </div>
            <div class="console-output" id="consoleOutput"></div>
          </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
          <button class="tool-btn" onclick="loadSampleScript('hello')">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M8 5l8 7-8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Hello World
          </button>
          <button class="tool-btn" onclick="loadSampleScript('esp')">ESP Example</button>
          <button class="tool-btn" onclick="loadSampleScript('players')">List Players</button>
          <div class="tool-btn-spacer"></div>
          <select class="pid-select" id="pidSelect">
            <option value="0">All instances</option>
          </select>
          <button class="tool-btn" onclick="toggleMethod()" id="methodBtn" title="Execution method">
            <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Pipe
          </button>
        </div>
      </div>
    </div><!-- /pageEditor -->



  </div><!-- /main -->
</div><!-- /app -->

<!-- ══ Modal: Redeem License ══ -->
<div class="modal-overlay" id="redeemModal">
  <div class="modal">
    <div class="modal-icon warn">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <h3>Redeem License</h3>
    <p>Enter your Synapse Z license key to activate.</p>
    <input class="modal-input" id="licenseInput" placeholder="XXXXX-XXXXX-XXXXX" maxlength="64"/>
    <div class="modal-msg" id="redeemMsg"></div>
    <div class="modal-row">
      <button class="modal-cancel" onclick="closeModal('redeemModal')">Cancel</button>
      <button class="modal-confirm" onclick="submitRedeem()">Activate</button>
    </div>
  </div>
</div>

<!-- ══ Modal: HWID Reset ══ -->
<div class="modal-overlay" id="hwidModal">
  <div class="modal">
    <div class="modal-icon danger">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114.93-4M20 12a8 8 0 01-14.93 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 7.5V4M19 7.5H15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <h3>Reset HWID?</h3>
    <p>Это сбросит привязку к вашему оборудованию. Используйте только если сменили ПК. Возможен кулдаун между сбросами.</p>
    <div class="modal-msg" id="hwidMsg"></div>
    <div class="modal-row">
      <button class="modal-cancel" onclick="closeModal('hwidModal')">Отмена</button>
      <button class="modal-confirm red" id="hwidConfirmBtn" onclick="doResetHwid()">Сбросить</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg"></span>
</div>

<script>
const API = "http://localhost:5000";
let usePipe = true;
let consoleOpen = false;
let lastLogCount = -1;
let instances = [];

// ── Page routing ───────────────────────────────────────────────────────────

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (name === 'editor') {
    document.getElementById('pageEditor').classList.add('active');
    document.getElementById('navEditor').classList.add('active');
    document.getElementById('topbarTitle').textContent = 'loader — RO-EXEC';
  }
}

// ── Status polling ─────────────────────────────────────────────────────────

async function refreshStatus() {
  try {
    const r = await fetch(`${API}/status`);
    const d = await r.json();
    const dot = document.getElementById("statusDot");
    const txt = document.getElementById("statusText");
    const sub = document.getElementById("statusSub");
    const cnt = document.getElementById("instanceCount");
    const sel = document.getElementById("pidSelect");

    instances = d.instances || [];
    cnt.textContent = instances.length;

    if (d.connected) {
      dot.className = "status-dot connected";
      txt.childNodes[0].textContent = "Connected";
      sub.textContent = `· ${instances.length} instance${instances.length !== 1 ? 's' : ''}`;
    } else {
      dot.className = "status-dot disconnected";
      txt.childNodes[0].textContent = "Disconnected";
      sub.textContent = "";
    }

    const current = sel.value;
    sel.innerHTML = '<option value="0">All instances</option>';
    instances.forEach(inst => {
      const opt = document.createElement("option");
      opt.value = inst.pid;
      opt.textContent = `PID ${inst.pid}`;
      sel.appendChild(opt);
    });
    sel.value = instances.find(i => i.pid == current) ? current : "0";
  } catch(e) {
    document.getElementById("statusDot").className = "status-dot disconnected";
    document.getElementById("statusText").childNodes[0].textContent = "Server offline";
    document.getElementById("statusSub").textContent = "";
  }
}

// ── Execute ────────────────────────────────────────────────────────────────

async function executeScript() {
  const script = document.getElementById("editor").value.trim();
  if (!script) return;

  const btn = document.getElementById("execBtn");
  btn.classList.add("loading");
  btn.textContent = "Executing...";

  const pid = parseInt(document.getElementById("pidSelect").value);

  try {
    const r = await fetch(`${API}/execute`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ script, pid, use_pipe: usePipe })
    });
    const d = await r.json();
    showToast(d.ok, d.ok ? `Script sent via ${d.method}` : d.error);
    if (d.ok && !consoleOpen) toggleConsole();
  } catch(e) {
    showToast(false, "Server offline — is server.py running?");
  }

  btn.classList.remove("loading");
  btn.textContent = "Execute";
}

// ── Console ────────────────────────────────────────────────────────────────

function toggleConsole() {
  const panel = document.getElementById("consolePanel");
  consoleOpen = !consoleOpen;
  panel.classList.toggle("open", consoleOpen);
  if (consoleOpen) pollLogs();
}

async function pollLogs() {
  if (!consoleOpen) return;
  try {
    const r = await fetch(`${API}/logs`);
    const logs = await r.json();
    if (logs.length !== lastLogCount) {
      lastLogCount = logs.length;
      const out = document.getElementById("consoleOutput");
      out.innerHTML = logs.map(l => `
        <div class="log-line ${l.type}">
          <span class="log-time">${l.time}</span>
          <span class="log-msg">${escHtml(l.text)}</span>
        </div>`).join('');
      out.scrollTop = out.scrollHeight;
    }
  } catch(e) {}
  if (consoleOpen) setTimeout(pollLogs, 500);
}

// ── Modals ─────────────────────────────────────────────────────────────────

function openRedeemModal() {
  document.getElementById("licenseInput").value = "";
  document.getElementById("redeemMsg").textContent = "";
  document.getElementById("redeemModal").classList.add("open");
}

function openHwidModal() {
  document.getElementById("hwidMsg").textContent = "";
  document.getElementById("hwidMsg").className = "modal-msg";
  document.getElementById("hwidConfirmBtn").disabled = false;
  document.getElementById("hwidModal").classList.add("open");
}

function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}

async function submitRedeem() {
  const key = document.getElementById("licenseInput").value.trim();
  if (!key) return;
  const msg = document.getElementById("redeemMsg");
  try {
    const r = await fetch(`${API}/redeem`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ key })
    });
    const d = await r.json();
    msg.textContent = d.message;
    msg.className = `modal-msg ${d.ok ? 'ok' : 'err'}`;
    if (d.ok) setTimeout(() => closeModal("redeemModal"), 1500);
  } catch(e) {
    msg.textContent = "Server offline";
    msg.className = "modal-msg err";
  }
}

async function doResetHwid() {
  const msg = document.getElementById("hwidMsg");
  const btn = document.getElementById("hwidConfirmBtn");
  btn.disabled = true;
  msg.textContent = "Сбрасываем...";
  msg.className = "modal-msg";

  try {
    const r = await fetch(`${API}/reset_hwid`, { method: "POST" });
    const d = await r.json();
    msg.textContent = d.message;
    msg.className = `modal-msg ${d.ok ? 'ok' : 'err'}`;
    if (d.ok) {
      setTimeout(() => {
        closeModal("hwidModal");
        showToast(true, "HWID успешно сброшен!");
      }, 1400);
    } else {
      btn.disabled = false;
    }
  } catch(e) {
    msg.textContent = "Server offline";
    msg.className = "modal-msg err";
    btn.disabled = false;
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────

function clearEditor() {
  document.getElementById("editor").value = "";
  updateLineNums();
}

function toggleMethod() {
  usePipe = !usePipe;
  document.getElementById("methodBtn").innerHTML = `
    <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    ${usePipe ? 'Pipe' : 'File'}`;
}

function loadSampleScript(type) {
  const scripts = {
    hello:   `print("Hello World!")`,
    esp:     `-- Basic ESP example\nfor _, player in pairs(game.Players:GetPlayers()) do\n    if player ~= game.Players.LocalPlayer then\n        print("Found: " .. player.Name)\n    end\nend`,
    players: `local players = game.Players:GetPlayers()\nprint("Players online: " .. #players)\nfor i, p in pairs(players) do\n    print(i .. ". " .. p.Name)\nend`
  };
  document.getElementById("editor").value = scripts[type] || "";
  updateLineNums();
}

function updateLineNums() {
  const ed = document.getElementById("editor");
  const ln = document.getElementById("lineNums");
  const lines = ed.value.split("\n").length;
  const current = ln.children.length;
  if (lines > current) {
    for (let i = current + 1; i <= lines; i++) {
      const s = document.createElement("span");
      s.textContent = i;
      ln.appendChild(s);
    }
  } else {
    while (ln.children.length > lines) ln.removeChild(ln.lastChild);
  }
  ln.scrollTop = ed.scrollTop;
}

let toastTimer;
function showToast(ok, msg) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.className = `toast show ${ok ? 'ok' : 'err'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function pad(n) { return String(n).padStart(2, '0'); }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Editor events ──────────────────────────────────────────────────────────

document.getElementById("editor").addEventListener("input", updateLineNums);
document.getElementById("editor").addEventListener("scroll", () => {
  document.getElementById("lineNums").scrollTop = document.getElementById("editor").scrollTop;
});
document.getElementById("editor").addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const el = e.target, s = el.selectionStart, end = el.selectionEnd;
    el.value = el.value.substring(0, s) + "    " + el.value.substring(end);
    el.selectionStart = el.selectionEnd = s + 4;
    updateLineNums();
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) executeScript();
});

// ── Init ───────────────────────────────────────────────────────────────────

updateLineNums();
// Start polling immediately — status dot will switch to green as soon as Roblox is detected
refreshStatus();
setInterval(refreshStatus, 3000);
</script>
